[project]
name = "transport-map"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TuomasHirv", email = "hirvonentume@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "shapely>=2.1.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
transport-map = "transport_map:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
