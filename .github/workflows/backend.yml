name: Backend

# Backend-only paths: a frontend-only commit skips this job rather than spending a
# runner re-testing an unchanged backend.
on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so this is pinned exactly.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # --locked fails if uv.lock has drifted from pyproject.toml instead of
      # silently resolving something different from what runs locally.
      # Python 3.12 comes from backend/.python-version.
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src tests

      # The suite runs entirely on tests/fixtures/; backend/data/ is gitignored and
      # absent here, which is exactly what keeps that true.
      - name: Test
        run: uv run pytest
